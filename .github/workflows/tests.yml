
name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure test environment
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private_key.pem 2048
          openssl rsa -in keys/private_key.pem \
            -pubout -out keys/public_key.pem

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://auth_user:auth_pass@localhost:5432/auth_db
          TEST_DATABASE_URL: postgresql://auth_user:auth_pass@localhost:5432/auth_db_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG_MODE: "False"
          KEYS_DIRECTORY: ./keys
          RESEND_API_KEY: test_key
          RESEND_EMAIL_ADDRESS: test@example.com
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth/google/callback
          APP_BASE_URL: http://localhost:8000
        run: pytest -v
